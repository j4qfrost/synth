[package]
license = "MIT OR Apache-2.0"
name = "synth"
version = "0.1.0"
edition = "2021"
description = "Polyphonic Rust synthesizer with hot-reloadable DSP"

[dependencies]
synth-state = { path = "../synth-state" }
synth-dsp = { path = "../synth-dsp" }
synth-fft = { workspace = true }
hot-lib-reloader = { workspace = true }
ringbuf = { workspace = true }
rosc = { workspace = true }
cpal = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
midir = { workspace = true }
crossbeam-channel = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
